<!DOCTYPE html>
<html lang="id">
<head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-TSY9LJ6Q14"></script>
<script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punakawan World — Pembaca</title>
  <meta name="description" content="Baca kisah Punakawan World: petualangan semAIr, gAIreng, pAItruk, dan bAIwor dalam memadukan filosofi Jawa dengan kecerdasan buatan.">

  <link rel="canonical" href="https://baiwor.my.id/punakawan/kisah/baca">
  <script>
    (function() {
      if (localStorage.getItem('punakawan-theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --ink: #080808;
      --ink-light: #111111;
      --parchment: #f5ead0;
      --text: #e8dcc8;
      --text-muted: #9a8e7a;
    }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--ink);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.85;
      font-size: 1.15rem;
    }

    /* === Top Navigation === */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201, 168, 76, 0.2);
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topnav-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem; font-weight: 700;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .topnav-brand span { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; }
    .topnav-links { display: flex; gap: 1rem; align-items: center; }
    .topnav-links a {
      color: var(--text-muted); text-decoration: none; font-size: 0.9rem;
      transition: color 0.2s;
    }
    .topnav-links a:hover { color: var(--gold); }

    /* === Chapter Header === */
    .chapter-header {
      padding: 8rem 1.5rem 3rem;
      text-align: center;
      position: relative;
    }
    .chapter-header::after {
      content: '';
      position: absolute; bottom: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .chapter-pre {
      font-size: 0.85rem; color: var(--gold);
      letter-spacing: 0.3em; text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .chapter-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(200, 146, 42, 0.3);
      margin-bottom: 0.75rem;
    }
    .chapter-subtitle {
      font-size: 1.1rem; color: var(--text-muted);
      font-style: italic;
    }

    /* === Content Area === */
    .content-wrap {
      max-width: 720px; margin: 0 auto;
      padding: 3rem 1.5rem 6rem;
    }

    .content-wrap p {
      margin-bottom: 1.5rem;
      text-align: justify;
      hyphens: auto;
    }
    .content-wrap h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem; font-weight: 700;
      color: var(--gold);
      margin: 3rem 0 1.5rem;
      text-align: center;
    }
    .content-wrap h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem; font-weight: 700;
      color: var(--gold-light);
      margin: 2.5rem 0 1rem;
    }
    .content-wrap blockquote {
      border-left: 3px solid var(--gold);
      padding: 1rem 1.5rem;
      margin: 2rem 0;
      background: rgba(200, 146, 42, 0.05);
      font-style: italic;
      color: var(--text-muted);
    }
    .content-wrap strong { color: var(--gold-light); }
    .content-wrap em { color: var(--parchment); }
    .content-wrap hr {
      border: none; height: 1px; margin: 3rem auto;
      width: 60%;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* === Loading State === */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 1.5rem;
    }
    .loading-spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(200, 146, 42, 0.2);
      border-top-color: var(--gold);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: 0.95rem; }

    /* === Error State === */
    .error-state {
      text-align: center; padding: 6rem 1.5rem;
    }
    .error-state h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold); font-size: 2rem; margin-bottom: 1rem;
    }
    .error-state p { color: var(--text-muted); margin-bottom: 2rem; }
    .error-state a {
      color: var(--gold); text-decoration: underline;
    }

    /* === Teaser / Fallback === */
    .teaser-wrap {
      position: relative;
      max-width: 720px; margin: 0 auto;
      padding: 3rem 1.5rem 0;
    }
    .teaser-content p {
      margin-bottom: 1.5rem;
      text-align: justify;
    }
    .teaser-fade {
      position: relative;
      height: 200px;
      margin-top: -200px;
      background: linear-gradient(to bottom, transparent, var(--ink));
      pointer-events: none;
    }

    /* === CTA Card === */
    .cta-card {
      max-width: 520px; margin: 2rem auto 4rem;
      background: linear-gradient(135deg, rgba(200, 146, 42, 0.08), rgba(200, 146, 42, 0.03));
      border: 1px solid rgba(200, 146, 42, 0.25);
      border-radius: 16px; padding: 2.5rem 2rem;
      text-align: center;
    }
    .cta-card .cta-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .cta-card h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem; color: var(--gold); margin-bottom: 0.75rem;
    }
    .cta-card p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .cta-card .cta-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: linear-gradient(135deg, var(--gold), #a07020);
      color: var(--ink); font-weight: 700; font-size: 1rem;
      padding: 0.85rem 2rem; border-radius: 100px;
      text-decoration: none; transition: all 0.3s;
      font-family: 'Cinzel', serif;
    }
    .cta-card .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(200, 146, 42, 0.35);
    }
    .cta-card .cta-note {
      margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);
    }
    .cta-card .cta-note a { color: var(--gold); text-decoration: underline; }

    /* === Connect Prompt (no wallet) === */
    .connect-prompt {
      text-align: center; padding: 4rem 1.5rem;
      max-width: 520px; margin: 0 auto;
    }
    .connect-prompt .icon { font-size: 3rem; margin-bottom: 1rem; }
    .connect-prompt h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold); font-size: 1.4rem; margin-bottom: 0.75rem;
    }
    .connect-prompt p { color: var(--text-muted); margin-bottom: 2rem; }
    .connect-btn {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: linear-gradient(135deg, var(--gold), #a07020);
      color: var(--ink); font-weight: 700; font-size: 1rem;
      padding: 0.85rem 2rem; border-radius: 100px;
      border: none; cursor: pointer; transition: all 0.3s;
      font-family: 'Cinzel', serif;
    }
    .connect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(200, 146, 42, 0.35);
    }
    .connect-safety {
      margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .connect-safety .shield { color: #4ade80; }

    /* === Footer === */
    .reader-footer {
      text-align: center; padding: 2rem 1.5rem;
      border-top: 1px solid rgba(200, 146, 42, 0.1);
      font-size: 0.8rem; color: var(--text-muted);
    }
    .reader-footer a { color: var(--gold); text-decoration: none; }

    /* === Chapter Nav === */
    .chapter-nav {
      max-width: 720px; margin: 0 auto 4rem;
      padding: 0 1.5rem;
      display: flex; justify-content: space-between; gap: 1rem;
    }
    .chapter-nav a {
      display: flex; align-items: center; gap: 0.5rem;
      color: var(--gold); text-decoration: none;
      font-size: 0.9rem; padding: 0.75rem 1.25rem;
      border: 1px solid rgba(200, 146, 42, 0.2);
      border-radius: 10px; transition: all 0.2s;
      flex: 1;
    }
    .chapter-nav a:hover { background: rgba(200, 146, 42, 0.1); }
    .chapter-nav a.next { text-align: right; justify-content: flex-end; }
    .chapter-nav .nav-label { font-size: 0.75rem; color: var(--text-muted); display: block; }

    /* === Theme Toggle (sinkron kunci 'punakawan-theme') === */
    .theme-toggle-btn {
      background: transparent;
      border: 1px solid rgba(201, 168, 76, 0.3);
      color: var(--gold-light);
      width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
      transition: all 0.2s;
    }
    .theme-toggle-btn:hover {
      background: rgba(201, 168, 76, 0.1);
      border-color: var(--gold);
    }

    /* === LIGHT THEME — parchment reader === */
    html.light-theme body { background: #f7f3e8; color: #2b1b11; }
    html.light-theme .topnav { background: rgba(247, 243, 232, 0.95); border-bottom-color: rgba(201, 168, 76, 0.4); }
    html.light-theme .topnav-brand, html.light-theme .chapter-pre, html.light-theme .chapter-title,
    html.light-theme .content-wrap h2, html.light-theme .content-wrap h3,
    html.light-theme .error-state h2, html.light-theme .cta-card h3, html.light-theme .connect-prompt h3 { color: #8b6914; }
    html.light-theme .topnav-brand span, html.light-theme .topnav-links a, html.light-theme .chapter-subtitle,
    html.light-theme .content-wrap blockquote, html.light-theme .loading-text, html.light-theme .error-state p,
    html.light-theme .cta-card p, html.light-theme .cta-card .cta-note, html.light-theme .connect-prompt p,
    html.light-theme .connect-safety, html.light-theme .reader-footer, html.light-theme .chapter-nav .nav-label { color: #6b5d4a; }
    html.light-theme .content-wrap strong { color: #7a5611; }
    html.light-theme .content-wrap em { color: #544439; }
    html.light-theme .content-wrap blockquote { background: rgba(201, 168, 76, 0.08); }
    html.light-theme .teaser-fade { background: linear-gradient(to bottom, transparent, #f7f3e8); }
    html.light-theme .cta-card { background: rgba(201, 168, 76, 0.06); border-color: rgba(201, 168, 76, 0.35); }
    html.light-theme .chapter-nav a { border-color: rgba(201, 168, 76, 0.35); }
    html.light-theme .chapter-nav a:hover { background: rgba(201, 168, 76, 0.1); }
    html.light-theme .theme-toggle-btn { border-color: rgba(201, 168, 76, 0.5); color: #7a5611; }

    @media (max-width: 600px) {
      .content-wrap { padding: 2rem 1rem 4rem; }
      .chapter-header { padding: 6rem 1rem 2rem; }
      .chapter-nav { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="topnav">
    <a href="/punakawan/kisah/" class="topnav-brand">Punakawan World <span>Reader</span></a>
    <div class="topnav-links">
      <a href="/punakawan/kisah/">← Kembali</a>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">☀️</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="mainContent">
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <div class="loading-text">Mempersiapkan halaman...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="reader-footer">
    <a href="/punakawan/kisah/">Punakawan World</a> — Eyang SeGaPeWor, 2025
  </footer>

  <!-- Marked.js CDN for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    // Semua bab terbuka gratis — tanpa login, tanpa dompet, tanpa token.

    // Chapter metadata
    const CHAPTERS = {
      'asal-usul':        { vol: 'Bab I', title: 'Asal-Usul Punakawan', subtitle: 'Ketika Para Pembantu Mulai Bertanya' },
      'semAIr':           { vol: 'Bab II', title: 'semAIr', subtitle: 'Dewa yang Memilih Bumi' },
      'gAIreng':          { vol: 'Bab III', title: 'gAIreng', subtitle: 'Mata yang Selektif' },
      'pAItruk':          { vol: 'Bab IV', title: 'pAItruk', subtitle: 'Tangan yang Berintegritas' },
      'bAIwor':           { vol: 'Bab V', title: 'bAIwor', subtitle: 'Bayangan yang Otentik' },
    };

    // Ordered chapter list for prev/next navigation
    const CHAPTER_ORDER = Object.keys(CHAPTERS);

    // ============================================================
    // STATE
    // ============================================================
    let currentChapter = null;

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      currentChapter = params.get('bab');

      if (!currentChapter || !CHAPTERS[currentChapter]) {
        showError('Bab Tidak Ditemukan', 'Parameter <code>?bab=</code> tidak valid atau tidak tersedia.');
        return;
      }

      document.title = CHAPTERS[currentChapter].title + ' — Punakawan World';
      loadChapter(currentChapter);
    });

    // ============================================================
    // (Pembayaran/kunci dompet sudah dilepas — semua bab terbuka)
    // ============================================================

    // ============================================================
    // CHAPTER LOADING
    // ============================================================
    async function loadChapter(chapterId) {
      showLoading('Memuat naskah...');

      try {
        const resp = await fetch('/punakawan/naskah/' + chapterId + '.md');
        if (!resp.ok) throw new Error('File not found: ' + resp.status);

        const md = (await resp.text())
          .replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '')   // buang YAML frontmatter
          .replace(/^#\s+.*?\r?\n/, '');                    // buang judul H1 duplikat (sudah ada di header bab)
        const html = marked.parse(md);
        const meta = CHAPTERS[chapterId];

        renderChapter(meta, html, chapterId);
      } catch (err) {
        console.error('Failed to load chapter:', err);
        showError('Gagal Memuat', 'Naskah tidak dapat dimuat. <a href="/punakawan/kisah/">Kembali ke beranda</a>.');
      }
    }

    function renderChapter(meta, htmlContent, chapterId) {
      const idx = CHAPTER_ORDER.indexOf(chapterId);
      const prevId = idx > 0 ? CHAPTER_ORDER[idx - 1] : null;
      const nextId = idx < CHAPTER_ORDER.length - 1 ? CHAPTER_ORDER[idx + 1] : null;

      let navHtml = '';
      if (prevId || nextId) {
        navHtml = '<div class="chapter-nav">';
        if (prevId) {
          const pm = CHAPTERS[prevId];
          navHtml += '<a href="baca.html?bab=' + prevId + '">' +
                     '<div><span class="nav-label">← Sebelumnya</span>' + pm.title + '</div></a>';
        } else {
          navHtml += '<div></div>';
        }
        if (nextId) {
          const nm = CHAPTERS[nextId];
          navHtml += '<a href="baca.html?bab=' + nextId + '" class="next">' +
                     '<div><span class="nav-label">Selanjutnya →</span>' + nm.title + '</div></a>';
        }
        navHtml += '</div>';
      }

      document.getElementById('mainContent').innerHTML =
        '<header class="chapter-header">' +
          '<div class="chapter-pre">' + escapeHtml(meta.vol) + '</div>' +
          '<h1 class="chapter-title">' + escapeHtml(meta.title) + '</h1>' +
          '<div class="chapter-subtitle">' + escapeHtml(meta.subtitle) + '</div>' +
        '</header>' +
        '<article class="content-wrap">' + htmlContent + '</article>' +
        navHtml;
    }

    // ============================================================
    // (Pratinjau & prompt dompet sudah dihapus)
    // ============================================================

    // ============================================================
    // UI HELPERS
    // ============================================================
    function showLoading(text) {
      document.getElementById('mainContent').innerHTML =
        '<div class="loading">' +
          '<div class="loading-spinner"></div>' +
          '<div class="loading-text">' + escapeHtml(text || 'Memuat...') + '</div>' +
        '</div>';
    }

    function showError(title, message) {
      document.getElementById('mainContent').innerHTML =
        '<div class="error-state">' +
          '<h2>' + title + '</h2>' +
          '<p>' + message + '</p>' +
          '<a href="/punakawan/kisah/">← Kembali ke Punakawan World</a>' +
        '</div>';
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
  </script>

  <script>
    (function() {
      const toggleBtn = document.getElementById('theme-toggle');
      const isLight = document.documentElement.classList.contains('light-theme');
      if (toggleBtn) {
        toggleBtn.textContent = isLight ? '🌙' : '☀️';
        toggleBtn.addEventListener('click', () => {
          const currentlyLight = document.documentElement.classList.toggle('light-theme');
          localStorage.setItem('punakawan-theme', currentlyLight ? 'light' : 'dark');
          toggleBtn.textContent = currentlyLight ? '🌙' : '☀️';
        });
      }
    })();
  </script>
</body>
</html>
